<script>
globalThis.pokCalcFactory=function(app,s,h){
 const {esc,fmt}=h,records=new Map(),closed=new Set();let serial=0,owner,closeTimer,pinned=false,query='';

 function table(rows,kind){return `<table class="pm-calc-table"><tbody>${rows.map(([label,text,extra])=>`<tr data-calc-row="${esc(label.toLowerCase())}"><th>${esc(label)}</th><td>${value(label,text,kind,extra||{})}</td></tr>`).join('')}</tbody></table>`;}

 box('rate','공격·시전 속도',table([['시전 속도 증가','94%'],['추가 배율','0%'],['초당 시전','4.00'],['시전 시간','0.25초']],'rate'),'attack',value('초당 시전','4.00/s','rate')),
 box('crit','치명타',table([['치명타 확률 증가','220%'],['최종 확률','32%'],['치명타 피해 배율','240%'],['평균 기여 배율','×1.448']],'crit'),'attack',value('최종 치명타 확률','32%','crit')),

 if(action==='buy-similar'){h.dialog('비슷한 아이템 찾기','<p>현재 아이템의 유형·요구량·옵션을 거래 검색 조건으로 확인합니다.</p><p class="pm-subtle">목업에서는 외부 거래 사이트를 열지 않습니다.</p>');return true;}
 return true;

 return{render,click,input,change,hide,snapshot:()=>structuredClone(state),restore:value=>{if(value)Object.assign(state,structuredClone(value));sync();},state};

 function library(){const box=main.querySelector('.pm-library-list');if(!box)return;const pool=s.slot==='weapon'?[['wand-better','불길의 선율','주문 피해 +92% · 시전 속도 +15%','DPS +6,600'],['wand-other','황혼의 지팡이','주문 피해 +78% · 지능 +24','DPS +2,400']]:s.slot.startsWith('ring')?[['better','여명의 고리','생명력 +105 · 화염 저항 +34%','DPS +10,800 · 총 화염 저항 +12%'],['other','서리의 고리','생명력 +82 · 냉기 저항 +36%','DPS +3,200 · 초과 냉기 저항 +8%']]:[];const candidates=pool.filter(row=>row[1].includes(s.query));box.innerHTML=candidates.length?candidates.map(([id,name,mods,delta])=>`<div class="pm-candidate ${(id.startsWith('wand')?s.weaponChoice===id:s.itemChoice===id)?'pm-picked':''}"><div><strong>${name}</strong><small>${mods}</small><small>${delta}</small></div><button data-equip="${id}" ${(id.startsWith('wand')?s.weaponChoice===id:s.itemChoice===id)?'disabled':''}>${(id.startsWith('wand')?s.weaponChoice===id:s.itemChoice===id)?'장착 중':'장착'}</button></div>`).join(''):'<p class="pm-subtle">일치하는 아이템이 없습니다.</p>';}

 function calcs(){const category=s.calcCategory;return`<div class="pm-context"><h2>계산 상세</h2><select aria-label="계산 대상"><option>화염구 · 주력 그룹</option><option>캐릭터 방어</option></select></div><div class="pm-calc-tabs">${['공격','방어','자원','능력치 요구'].map(name=>`<button data-calc-category="${name}" aria-pressed="${name===category}">${name}</button>`).join('')}</div>${category==='공격'?`<div class="pm-context"><h3>화염구 피해</h3><small>${s.pending?'이전 계산 · 갱신 중':'현재 구성'}</small></div><div class="pm-breakdown"><div><small>총 DPS</small><strong>${fmt(s.good.dps)}</strong></div><div><small>평균 타격 피해</small><strong>${fmt(s.good.dps/4)}</strong></div><div><small>초당 시전</small><strong>4.00회</strong></div></div><table class="pm-table"><thead><tr><th>계산 항목</th><th>현재 값</th><th>관련 위치</th></tr></thead><tbody><tr><td>화염구 기본 피해</td><td>240–360</td><td><button data-tab="skills">화염구 레벨 보기</button></td></tr><tr><td>피해 증가 · 감소 합계</td><td>+280%</td><td><button data-slot="weapon">주 무기 보기</button></td></tr><tr><td>증폭 · 감폭 배율</td><td>1.62배</td><td><button data-tab="skills">보조 젬 보기</button></td></tr><tr><td>치명타 확률 / 배율</td><td>32% / 240%</td><td><button data-tab="tree">패시브에서 보기</button></td></tr><tr><td>시전 속도 증가</td><td>+94%</td><td><button data-slot="ring">관련 장비 보기</button></td></tr></tbody></table><p class="pm-subtle">항목을 펼쳐 산출 근거를 확인하고 관련 장비·젬·패시브로 바로 이동합니다.</p>`:`<h3>${category} 계산</h3><table class="pm-table"><thead><tr><th>항목</th><th>현재 값</th><th>산출 근거</th></tr></thead><tbody><tr><td>${category==='능력치 요구'?'지능':'최대 생명력'}</td><td>${category==='능력치 요구'?'182 / 필요 170':fmt(s.good.life)}</td><td><button data-slot="body">장비에서 보기</button></td></tr><tr><td>적용 중인 조건</td><td>기본 구성</td><td><button data-tab="config">조건에서 보기</button></td></tr></tbody></table>`}`;}

 function compare(){return`<div class="pm-context"><h2>원안과 비교</h2><button data-action="reset">원안으로 되돌리기</button></div><p class="pm-subtle">원안은 고정 · 수정안은 현재 편집의 계산 결과</p><table class="pm-table" style="margin-top:12px"><thead><tr><th>항목</th><th>원안</th><th>수정안</th><th>차이</th></tr></thead><tbody><tr><td>총 DPS</td><td>124,800</td><td>${fmt(s.good.dps)}</td><td>${fmt(s.good.dps-124800)}</td></tr><tr><td>생명력</td><td>3,450</td><td>${fmt(s.good.life)}</td><td>${fmt(s.good.life-3450)}</td></tr><tr><td>화염 저항</td><td>66%</td><td>${s.good.fire}%</td><td>+${s.good.fire-66}%</td></tr></tbody></table><div class="pm-section"><h3>구성 변경</h3><div class="pm-field"><span>반지 I</span><button data-slot="ring">${s.ring?'잿빛 고리 → 여명의 고리':'변경 없음'}</button></div><div class="pm-field"><span>화염구 레벨</span><button data-tab="skills">20 → ${s.level}</button></div></div>${s.pending?'<div class="pm-warning">수정안 갱신 중 · 이전 계산값 표시</div>':''}`;}
 function transfer(){return `<div class="pm-transfer-panel"><div class="pm-context"><h2>Import/Export Build</h2><small>빌드 가져오기 · 공유 · 내보내기</small></div><div class="pm-calc-tabs"><button data-transfer-mode="import" aria-pressed="${s.transferMode==='import'}">Import Build</button><button data-transfer-mode="export" aria-pressed="${s.transferMode==='export'}">Export Build</button></div>${s.transferMode==='import'?`<section><h3>PoB 코드 또는 링크로 가져오기</h3><label>빌드 코드 / 링크<textarea aria-label="가져올 빌드 코드" placeholder="PoB에서 복사한 코드 또는 공유 링크"></textarea></label><div class="pm-actions"><button data-action="import-preview" class="pm-primary">가져올 빌드 확인</button><button data-action="import-file">파일에서 가져오기</button></div><p class="pm-subtle">가져오기는 새 빌드로 열어 현재 빌드를 유지합니다.</p></section><section class="pm-section"><h3>계정 · 캐릭터 가져오기</h3><label>계정 이름<input aria-label="가져올 계정 이름" placeholder="계정 이름"></label><div class="pm-actions" style="margin-top:10px"><button data-action="import-character">캐릭터 선택</button></div></section>`:`<section><h3>현재 빌드 공유</h3><label>공유 코드<textarea aria-label="내보낼 빌드 코드" readonly placeholder="코드를 생성하면 여기에 표시됩니다."></textarea></label><div class="pm-actions"><button data-action="export-code" class="pm-primary">공유 코드 생성</button><button data-action="export-copy">코드 복사</button></div></section><section class="pm-section"><h3>파일로 내보내기</h3><div class="pm-actions" style="margin-top:10px"><button data-action="export-xml">PoB XML</button><button data-action="export-json">POK 작업 문서</button></div><p class="pm-subtle">POK 작업 문서에는 원문·진단 기록도 함께 보존합니다.</p></section>`}</div>`;}
 function renderMain(){gearKit.hide();calcKit.hide();main.classList.toggle('pm-calcs-main',s.tab==='calcs');app.classList.toggle('pm-calcs-active',s.tab==='calcs');main.classList.toggle('pm-gear-main',s.tab==='gear');app.classList.toggle('pm-equipment-active',s.tab==='gear');app.querySelector('[data-action=transfer]').setAttribute('aria-pressed',String(s.tab==='transfer'));main.innerHTML=s.tab==='transfer'?transfer():s.tab==='gear'?gearKit.render():s.tab==='skills'?skills():s.tab==='calcs'?calcKit.render():s.tab==='config'?config():s.tab==='tree'?tree():s.tab==='compare'?compare():s.tab==='notes'?'<div class="pm-context"><h2>빌드 노트</h2><small>입력하면 자동 저장</small></div><textarea class="pm-note" aria-label="빌드 노트">보스전에서는 보스 조건 세트로 전환.\n다음 업그레이드: 반지의 화염 저항 보완.</textarea>':'<div class="pm-context"><h2>파티</h2><button data-action="party-add">파티원 추가</button></div><label class="pm-field"><span>파티 버프 사용</span><input type="checkbox" data-buff></label><label class="pm-field"><span>파티원 구성</span><select><option>지원 캐릭터</option><option>직접 편집</option></select></label><p class="pm-subtle">파티 효과와 적용 조건을 항목별로 확인합니다.</p>';library();app.querySelector('.pm-nav').innerHTML=nav();app.querySelector('.pm-side-nav').innerHTML=nav()+'<div class="pm-sidebar-bottom"><button data-action="settings">'+icon('settings-2')+'설정</button></div>';app.querySelector('[data-character-level]').value=s.characterLevel;app.querySelector('[data-character-class]').value=s.characterClass;app.querySelector('.pm-passive-count').textContent=s.passives+'/123';app.querySelector('.pm-ascend-count').textContent=s.ascendUsed+'/8';icons();}
 function dialog(title,content){const overlay=app.querySelector('.pm-overlay');overlay.hidden=false;overlay.querySelector('.pm-dialog').innerHTML=`<h2>${title}</h2>${content}<div class="pm-actions"><button data-action="close-dialog">닫기</button></div>`;icons();}
 app.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button||button.disabled)return;if(button.dataset.numberStep){const input=button.parentElement.querySelector('input');if(button.dataset.numberStep==='up')input.stepUp();else input.stepDown();input.dispatchEvent(new Event('input',{bubbles:true}));updateSteppers();return;}if(gearKit.click(button)||calcKit.click(button))return;
  if(button.dataset.tab){s.tab=button.dataset.tab;renderMain();persist();return;}
  if(button.dataset.slot){s.slot=button.dataset.slot;s.tab='gear';renderMain();persist();return;}
  if(button.dataset.calc!==undefined){s.tab='calcs';s.calcCategory=button.dataset.calc==='생명력'||button.dataset.calc==='에너지 보호막'?'방어':'공격';renderMain();return;}
  if(button.dataset.calcCategory){s.calcCategory=button.dataset.calcCategory;renderMain();return;}
  if(button.dataset.equip){const before=snapshot();if(button.dataset.equip.startsWith('wand')){s.weaponChoice=button.dataset.equip;s.weaponDamage=s.weaponChoice==='wand-better'?92:78;s.slot='weapon';}else{s.itemChoice=button.dataset.equip;s.ring=s.itemChoice==='better';s.life=s.ring?105:82;s.slot='ring';}changed('반지 장착',before);renderMain();return;}
  if(button.dataset.weapon){app.querySelectorAll('[data-weapon]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));toast('선택한 무기 세트로 자동 갱신');queueCalc();return;}
  if(button.dataset.transferMode){s.transferMode=button.dataset.transferMode;renderMain();return;}
  const action=button.dataset.action;
  if(action==='save'){s.dirty=false;app.querySelector('.pm-save-status').textContent='저장됨';toast('현재 빌드 저장 · 시연');persist();return;}
  if(action==='save-as'){const name=app.querySelector('.pm-build select').selectedOptions[0].textContent;dialog('다른 이름으로 저장',`<label>빌드 이름<input data-save-name aria-label="새 빌드 이름" value="${esc(name+' 복사본')}" style="width:100%;margin-top:8px"></label><p class="pm-subtle">현재 구성을 새 파일로 저장하고 기존 파일을 유지합니다.</p><div class="pm-actions"><button class="pm-primary" data-action="confirm-save-as">새 이름으로 저장</button></div>`);return;}
  if(action==='confirm-save-as'){const name=app.querySelector('[data-save-name]').value.trim();if(!name)return;const select=app.querySelector('.pm-build select'),option=document.createElement('option');option.textContent=name;option.value='copy-'+Date.now();select.appendChild(option);select.value=option.value;s.dirty=false;app.querySelector('.pm-save-status').textContent='저장됨';app.querySelector('.pm-overlay').hidden=true;toast('새 빌드로 저장 · 시연');persist();return;}

 function restore(value){if(!value||value.modelContent?.mockRevision!=='dense-calcs')return;const model=value.modelContent||{},saved=value.privateContent||{};if(model.layout!==(layout==='top'?'상단 작업 탭':'좌측 작업 목록'))return;if(model.screen==='transfer'||tabs.some(row=>row[0]===model.screen))s.tab=model.screen;if(slots.some(row=>row[0]===saved.slot))s.slot=saved.slot;if(typeof saved.ring==='boolean'){s.ring=saved.ring;s.itemChoice=s.ring?'better':'base';s.life=s.ring?105:70;}if(Number.isFinite(saved.level)&&saved.level>=1&&saved.level<=24)s.level=saved.level;for(const key of ['characterLevel','life','weaponDamage','quality','support1','support2','gemQuality0','gemQuality1','gemQuality2'])if(Number.isFinite(saved[key]))s[key]=saved[key];if(['소서리스','위치','레인저','몽크','워리어','머서너리'].includes(saved.characterClass))s.characterClass=saved.characterClass;if(Number.isSafeInteger(saved.passives)&&saved.passives>=0&&saved.passives<=123)s.passives=saved.passives;if(['base','better','other'].includes(saved.itemChoice)){s.itemChoice=saved.itemChoice;s.ring=s.itemChoice==='better';}if(['base','wand-better','wand-other'].includes(saved.weaponChoice))s.weaponChoice=saved.weaponChoice;if(typeof saved.dirty==='boolean')s.dirty=saved.dirty;app.querySelector('.pm-save-status').textContent=s.dirty?'저장하지 않은 변경':'저장됨';s.good=sample();renderMain();renderStats();}
 restore(window.openai?.widgetState);
